@media(prefers-color-scheme:dark){:root{--bg:#12141a;--card:#1b1f27;--ink:#eceef3;--muted:#98a0ae;--line:#2d333f;--brand:#ff3b52;--soft:#3a1a20;--ok:#3ccf85;--okb:#12301f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--muted);font-size:14px}
.search{display:flex;gap:8px;margin:16px 0 8px}
input{flex:1;min-width:0;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:13px 14px}
input:focus{outline:0;border-color:var(--brand)}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:0 20px;background:var(--brand);color:#fff;cursor:pointer}
#sug{position:absolute;left:0;right:0;top:100%;margin-top:-4px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:10;overflow:hidden;display:none}
#sug div{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
#sug div:last-child{border:0}
#sug div:hover,#sug div.on{background:var(--soft)}
#sug small{color:var(--muted);margin-left:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chips button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:5px 11px;border-radius:99px;font-weight:600;font-size:13px}
.chips button:hover{border-color:var(--brand);color:var(--brand)}
.res h2{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:600}
.c{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center}
.c.first{border-color:var(--ok);background:linear-gradient(var(--okb),var(--card) 70px)}
.c b{font-size:17px}.min{font-size:26px;font-weight:800;text-align:right;line-height:1}
.min small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:3px}
.emp{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.emp span{background:var(--soft);color:var(--brand);border-radius:99px;font-size:12px;font-weight:700;padding:1px 9px}
.meta{grid-column:1/-1;font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.meta a{color:var(--brand)}
.badge{font-size:11px;background:var(--ok);color:#fff;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.note{font-size:12.5px;color:var(--muted);margin-top:16px}
.err{color:var(--brand);font-weight:600}
</style>
</head>

const norm=s=>(s||"").toString().normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const POBN={}; Object.keys(POB).forEach(k=>POBN[norm(k)]=k);

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function km(a,b){const R=6371,r=x=>x*Math.PI/180,A=r(b[0]-a[0]),B=r(b[1]-a[1]);const h=Math.sin(A/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(B/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function findPob(q){const n=norm(q);if(!n)return null;let k=POBN[n]?n:Object.keys(POBN).find(x=>x.startsWith(n))||Object.keys(POBN).find(x=>x.includes(n));return k?{name:POBN[k],ll:POB[POBN[k]]}:null}
const VB="1.3,42.4,2.7,41.15";
async function remote(q,n){try{const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit="+n+"&countrycodes=es&bounded=1&viewbox="+VB+"&q="+encodeURIComponent(q));
  return (await r.json()).map(x=>({name:x.display_name.split(",").slice(0,2).map(t=>t.trim()).join(", "),ll:[+x.lat,+x.lon]}))}catch(e){return[]}}
async function geocode(q){
  const n=norm(q);if(POBN[n])return{name:POBN[n],ll:POB[POBN[n]]};
  const r=await remote(q,1);if(r[0])return r[0];
  return findPob(q)}
function localMatches(q){const n=norm(q),out=[],seen=new Set();
  for(const k of Object.keys(POBN)){if(k.startsWith(n)||k.split(" ").some(w=>w.startsWith(n))){const nm=POBN[k];if(!seen.has(nm)){seen.add(nm);out.push({name:nm,ll:POB[nm]})}}}
  return out.slice(0,5)}
const est=(ll,c)=>Math.max(3,Math.round(km(ll,[c.lat,c.lng])*1.3/45*60));
const fm=(m,e)=>(e?"~":"")+(m>=60?Math.floor(m/60)+" h "+m%60+" min":m+" min");
async function route(ll){
  const cs=CENTROS;const coords=[ll,...cs.map(c=>[c.lat,c.lng])].map(x=>x[1]+","+x[0]).join(";");
  try{const r=await fetch(`https://router.project-osrm.org/table/v1/driving/${coords}?sources=0&destinations=${cs.map((_,i)=>i+1).join(";")}&annotations=duration,distance`);
    const j=await r.json();if(j.code!=="Ok")throw 0;
    return cs.map((c,i)=>({c,m:Math.max(1,Math.round(j.durations[0][i]/60)),k:Math.round(j.distances[0][i]/100)/10,e:false}))}
  catch(e){return cs.map(c=>({c,m:est(ll,c),k:Math.round(km(ll,[c.lat,c.lng])*13)/10,e:true}))}}
function draw(name,rows,ll){
  rows.sort((a,b)=>a.m-b.m);
  $("#res").innerHTML=`<h2>Desde <b>${esc(name)}</b> · ordenados por tiempo</h2>`+rows.map((x,i)=>{
    const c=x.c,lis=[...new Set(c.emp.map(e=>c.det[e].listas))].join(" / ");
    return`<div class="c ${i?"":"first"}"><div><b>${esc(c.nombre)}</b>${i?"":'<span class="badge">MÁS CERCANO</span>'}
    <div class="emp">${c.emp.map(e=>`<span>${e}</span>`).join("")}</div></div>
    <div class="min">🚗 ${fm(x.m,x.e)}<small>${x.k} km${x.e?" (aprox.)":""}</small></div>
    <div class="meta"><span>📅 Listas: ${esc(c.emp.map(e=>e+": "+c.det[e].listas).join(" · "))}</span>
    <a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin=${ll[0]},${ll[1]}&destination=${c.lat},${c.lng}&travelmode=transit">Ruta en transporte público ↗</a></div></div>`}).join("")}
let seq=0;
async function go(q,pre){
  q=q.trim();if(!q)return;const my=++seq;$("#sug").style.display="none";$("#res").innerHTML='<div class="sub">Buscando…</div>';
  const g=pre||await geocode(q);if(my!==seq)return;
  if(!g){$("#res").innerHTML='<div class="err">No encuentro esa zona. Prueba con el nombre del barrio o municipio.</div>';return}
  const base=CENTROS.map(c=>({c,m:est(g.ll,c),k:Math.round(km(g.ll,[c.lat,c.lng])*13)/10,e:true}));
  draw(g.name,base,g.ll);
  const real=await route(g.ll);if(my===seq)draw(g.name,real,g.ll)}
$("#f").onsubmit=e=>{e.preventDefault();go($("#q").value)};
let sugT,sugSeq=0,sugList=[];
function showSug(l){sugList=l;const e=$("#sug");e.style.display=l.length?"block":"none";e.innerHTML=l.map((x,i)=>`<div data-i="${i}">${esc(x.name)}</div>`).join("")}
$("#q").addEventListener("input",()=>{clearTimeout(sugT);const q=$("#q").value.trim();if(q.length<2){showSug([]);return}
  const loc=localMatches(q);showSug(loc);const my=++sugSeq;
  sugT=setTimeout(async()=>{const r=await remote(q,6);if(my!==sugSeq)return;const seen=new Set(loc.map(x=>norm(x.name)));
    showSug(loc.concat(r.filter(x=>!seen.has(norm(x.name)))).slice(0,8))},450)});
$("#sug").onclick=e=>{const d=e.target.closest("[data-i]");if(!d)return;const x=sugList[+d.dataset.i];$("#q").value=x.name.replace("Barcelona · ","");go(x.name,x)};
document.addEventListener("click",e=>{if(!e.target.closest("#sug,#q"))$("#sug").style.display="none"});
$("#chips").innerHTML=["Sant Andreu","Nou Barris","Sants","L'Hospitalet de Llobregat","Badalona","Santa Coloma de Gramenet","Sabadell","Terrassa","Granollers","Viladecans"].map(x=>`<button type="button">${x}</button>`).join("");
$("#chips").onclick=e=>{if(e.target.tagName==="BUTTON"){$("#q").value=e.target.textContent;go(e.target.textContent)}};
